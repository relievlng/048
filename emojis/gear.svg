<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <mask id="gm">
      <rect x="0" y="0" width="128" height="128" fill="white"/>
      <circle cx="64" cy="64" r="20" fill="black"/>
    </mask>
  </defs>
  <!-- Gear body + 8 teeth -->
  <g mask="url(#gm)">
    <circle cx="64" cy="64" r="40" fill="#949BA4"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(0,64,64)"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(45,64,64)"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(90,64,64)"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(135,64,64)"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(180,64,64)"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(225,64,64)"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(270,64,64)"/>
    <rect x="56" y="6"  width="16" height="30" rx="5" fill="#949BA4" transform="rotate(315,64,64)"/>
    <!-- Inner ring for depth -->
    <circle cx="64" cy="64" r="28" fill="#80848E"/>
    <circle cx="64" cy="64" r="22" fill="none" stroke="#B5BAC1" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
