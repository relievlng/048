  <rect x="42" y="42" width="44" height="44" rx="6" fill="#4752C4"/>
  <!-- Circuit cross -->
  <line x1="64" y1="48" x2="64" y2="80" stroke="#5865F2" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <line x1="48" y1="64" x2="80" y2="64" stroke="#5865F2" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <!-- Pins top -->
  <rect x="46" y="20" width="9" height="13" rx="4" fill="#5865F2"/>
  <rect x="61" y="20" width="9" height="13" rx="4" fill="#5865F2"/>
  <rect x="76" y="20" width="9" height="13" rx="4" fill="#5865F2"/>
  <!-- Pins bottom -->
  <rect x="46" y="95" width="9" height="13" rx="4" fill="#5865F2"/>
  <rect x="61" y="95" width="9" height="13" rx="4" fill="#5865F2"/>
  <rect x="76" y="95" width="9" height="13" rx="4" fill="#5865F2"/>
  <!-- Pins left -->
  <rect x="20" y="46" width="13" height="9" rx="4" fill="#5865F2"/>
  <rect x="20" y="61" width="13" height="9" rx="4" fill="#5865F2"/>
  <rect x="20" y="76" width="13" height="9" rx="4" fill="#5865F2"/>
  <!-- Pins right -->
  <rect x="95" y="46" width="13" height="9" rx="4" fill="#5865F2"/>
  <rect x="95" y="61" width="13" height="9" rx="4" fill="#5865F2"/>
  <rect x="95" y="76" width="13" height="9" rx="4" fill="#5865F2"/>
